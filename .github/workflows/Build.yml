name: 🏗️ Build and Tag

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  actions: write

jobs:
  build-and-test:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest

    outputs:
      should-tag: ${{ steps.check-branch.outputs.should-tag }}
      jar-path: ${{ steps.build.outputs.jar-path }}
      jar-name: ${{ steps.build.outputs.jar-name }}

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for tags

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🔧 Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: 🔨 Make gradlew executable
      run: chmod +x ./gradlew

    - name: 🧪 Run tests
      run: |
        echo "::group::Running tests"
        ./gradlew test --console=plain
        echo "::endgroup::"

    - name: 🏗️ Build application and create JAR
      id: build
      run: |
        echo "::group::Building application"
        ./gradlew build bootJar --console=plain
        
        # Find the generated JAR file
        JAR_FILE=$(find build/libs -name "*.jar" -not -name "*-plain.jar" | head -1)
        JAR_NAME=$(basename "$JAR_FILE")
        
        echo "jar-path=$JAR_FILE" >> $GITHUB_OUTPUT
        echo "jar-name=$JAR_NAME" >> $GITHUB_OUTPUT
        
        echo "✅ Built JAR: $JAR_NAME"
        echo "📦 JAR location: $JAR_FILE"
        echo "::endgroup::"

    - name: 📤 Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: application-jar
        path: ${{ steps.build.outputs.jar-path }}
        retention-days: 30

    - name: ✅ Build completed successfully
      run: echo "✅ Build and tests passed successfully!"

    - name: 🎯 Check if we should create tag
      id: check-branch
      run: |
        # Check if this is a bot commit to prevent infinite loops
        if [[ "${{ github.actor }}" == "github-actions[bot]" ]]; then
          echo "should-tag=false" >> $GITHUB_OUTPUT
          echo "⏭️ Skipping tag creation (bot commit detected)"
          exit 0
        fi
        
        # Check if only workflow files were changed
        if [[ "${{ github.event_name }}" == "push" ]]; then
          echo "::group::Checking changed files"
          
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || echo "")
          echo "Changed files: $CHANGED_FILES"
          
          # Check if only workflow files were changed
          NON_WORKFLOW_CHANGES=$(echo "$CHANGED_FILES" | grep -v "^\.github/workflows/" | grep -v "^$" || true)
          
          if [[ -z "$NON_WORKFLOW_CHANGES" && -n "$CHANGED_FILES" ]]; then
            echo "should-tag=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping tag creation (only workflow files changed)"
            echo "::endgroup::"
            exit 0
          fi
          
          echo "::endgroup::"
        fi
        
        if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ]] && [[ "${{ github.event_name }}" == "push" ]]; then
          echo "should-tag=true" >> $GITHUB_OUTPUT
          echo "🏷️ Will create tag after successful build"
        else
          echo "should-tag=false" >> $GITHUB_OUTPUT
          echo "⏭️ Skipping tag creation (not main/master branch or not a push)"
        fi

  create-tag:
    name: 🏷️ Create Tag & Release
    needs: build-and-test
    runs-on: ubuntu-latest
    if: needs.build-and-test.outputs.should-tag == 'true'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🔍 Get latest tag and calculate new version
      id: version
      run: |
        echo "::group::Calculating new version"
        
        # Get the latest tag, or use v0.5.0 as base since next should be v0.6.0
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.5.0")
        echo "📌 Latest tag: $LATEST_TAG"
        
        # Remove 'v' prefix if present
        VERSION=${LATEST_TAG#v}
        
        # Split version into parts
        IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
        MAJOR=${VERSION_PARTS[0]:-0}
        MINOR=${VERSION_PARTS[1]:-5}
        PATCH=${VERSION_PARTS[2]:-0}
        
        # Read commit message safely from git to avoid script injection/splitting
        COMMIT_MSG="$(git log -1 --pretty=%B || echo "")"
        echo "📝 Commit message:"
        echo "$COMMIT_MSG"
        
        # Use simpler, more robust regex patterns
        # Note: In character classes, backslash-escape the opening paren to avoid parse errors
        if [[ "$COMMIT_MSG" =~ ^major[:\(] ]]; then
          NEW_MAJOR=$((MAJOR + 1))
          NEW_MINOR=0
          NEW_PATCH=0
          INCREMENT_TYPE="major"
          EMOJI="🚀"
        elif [[ "$COMMIT_MSG" =~ ^fix[:\(] ]]; then
          NEW_MAJOR=$MAJOR
          NEW_MINOR=$MINOR
          NEW_PATCH=$((PATCH + 1))
          INCREMENT_TYPE="patch"
          EMOJI="🐛"
        elif [[ "$COMMIT_MSG" =~ ^chore[:\(] ]]; then
          NEW_MAJOR=$MAJOR
          NEW_MINOR=$MINOR
          NEW_PATCH=$((PATCH + 1))
          INCREMENT_TYPE="patch"
          EMOJI="🔧"
        else
          # Default: increment minor (for feat, regular commits, etc.)
          NEW_MAJOR=$MAJOR
          NEW_MINOR=$((MINOR + 1))
          NEW_PATCH=0
          INCREMENT_TYPE="minor"
          EMOJI="✨"
        fi
        
        NEW_VERSION="v$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
        NEW_VERSION_NO_V="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
        
        echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "new-version-no-v=$NEW_VERSION_NO_V" >> $GITHUB_OUTPUT
        echo "increment-type=$INCREMENT_TYPE" >> $GITHUB_OUTPUT
        echo "emoji=$EMOJI" >> $GITHUB_OUTPUT
        echo "$EMOJI Incrementing $INCREMENT_TYPE version: $LATEST_TAG → $NEW_VERSION"
        echo "::endgroup::"

    - name: 📝 Update build.gradle version
      run: |
        echo "::group::Updating build.gradle version"
        NEW_VERSION="${{ steps.version.outputs.new-version-no-v }}"
        
        # Update the version in build.gradle
        sed -i "s/version = '.*'/version = '$NEW_VERSION'/" build.gradle
        
        echo "✅ Updated build.gradle version to: $NEW_VERSION"
        
        # Show the change
        echo "📄 Updated build.gradle:"
        grep "version = " build.gradle
        echo "::endgroup::"

    - name: 📥 Download original JAR
      uses: actions/download-artifact@v4
      with:
        name: application-jar
        path: ./downloaded-jar

    - name: 🔄 Rename JAR with new version
      id: final-jar
      run: |
        echo "::group::Preparing final JAR"
        NEW_VERSION="${{ steps.version.outputs.new-version-no-v }}"
        
        # Find the downloaded JAR
        ORIGINAL_JAR=$(find ./downloaded-jar -name "*.jar" | head -1)
        ORIGINAL_NAME=$(basename "$ORIGINAL_JAR")
        
        # Create new JAR name with correct version
        # Extract base name without version and add new version
        BASE_NAME=$(echo "$ORIGINAL_NAME" | sed 's/-[0-9]\+\.[0-9]\+\.[0-9]\+.*\.jar$//')
        NEW_JAR_NAME="${BASE_NAME}-${NEW_VERSION}.jar"
        NEW_JAR_PATH="./downloaded-jar/$NEW_JAR_NAME"
        
        # Only rename if the names are different
        if [[ "$ORIGINAL_NAME" != "$NEW_JAR_NAME" ]]; then
          echo "📝 Renaming JAR: $ORIGINAL_NAME → $NEW_JAR_NAME"
          mv "$ORIGINAL_JAR" "$NEW_JAR_PATH"
          echo "✅ JAR renamed successfully"
        else
          echo "ℹ️  JAR already has correct name: $ORIGINAL_NAME"
          NEW_JAR_PATH="$ORIGINAL_JAR"
        fi
        
        echo "jar-path=$NEW_JAR_PATH" >> $GITHUB_OUTPUT
        echo "jar-name=$NEW_JAR_NAME" >> $GITHUB_OUTPUT
        
        echo "📦 Final JAR location: $NEW_JAR_PATH"
        echo "::endgroup::"

    - name: 📝 Commit version update
      run: |
        echo "::group::Committing version update"
        NEW_VERSION="${{ steps.version.outputs.new-version }}"
        
        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Add and commit the version change
        git add build.gradle
        git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
        
        # Pull with rebase to incorporate any commits that landed since checkout
        git pull --rebase origin ${{ github.ref_name }} || { echo "ERROR: Rebase failed due to conflicts. The rebase has been aborted. Please resolve conflicts in a separate commit and re-trigger this workflow." >&2; git rebase --abort; exit 1; }
        git push origin ${{ github.ref_name }}
        
        echo "✅ Committed version update"
        echo "::endgroup::"

    - name: 🏷️ Create and push tag
      id: create-tag
      run: |
        echo "::group::Creating Git tag"
        NEW_VERSION="${{ steps.version.outputs.new-version }}"
        INCREMENT_TYPE="${{ steps.version.outputs.increment-type }}"
        EMOJI="${{ steps.version.outputs.emoji }}"
        
        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Create annotated tag
        git tag -a "$NEW_VERSION" -m "$EMOJI Auto-increment $INCREMENT_TYPE version to $NEW_VERSION
        
        Build: ${{ github.run_number }}
        Commit: ${{ github.sha }}
        Triggered by: ${{ github.actor }}"
        
        # Push the tag
        git push origin "$NEW_VERSION"
        
        echo "✅ Created and pushed tag: $NEW_VERSION"
        echo "tag-created=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "::endgroup::"

    - name: 📦 Create GitHub Release with JAR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "::group::Creating GitHub Release"
        NEW_VERSION="${{ steps.version.outputs.new-version }}"
        INCREMENT_TYPE="${{ steps.version.outputs.increment-type }}"
        EMOJI="${{ steps.version.outputs.emoji }}"
        JAR_PATH="${{ steps.final-jar.outputs.jar-path }}"
        JAR_NAME="${{ steps.final-jar.outputs.jar-name }}"
        
        # Safely capture the last commit message
        COMMIT_MSG="$(git log -1 --pretty=%B || echo "")"
        
        # Build release notes in a temp file to avoid quoting/injection issues
        NOTES_FILE=$(mktemp)
        {
          echo "## $EMOJI Changes";
          echo "Auto-generated release for **$NEW_VERSION**";
          echo "";
          echo "**📈 Increment Type:** $INCREMENT_TYPE  ";
          echo "**🔨 Build:** #${{ github.run_number }}  ";
          echo "**📝 Commit:** \`${{ github.sha }}\`  ";
          echo "**👤 Triggered by:** ${{ github.actor }}";
          echo "";
          echo "### 📦 Downloads";
          echo "- **JAR File:** \`$JAR_NAME\`";
          echo "";
          echo "### 💬 Commit Message";
          echo '```';
          echo "$COMMIT_MSG";
          echo '```';
          echo "";
          echo "### 🚀 Installation";
          echo "\`\`\`bash";
          echo "java -jar $JAR_NAME";
          echo "\`\`\`";
        } > "$NOTES_FILE"
        
        gh release create "$NEW_VERSION" \
          --title "$EMOJI Release $NEW_VERSION" \
          --notes-file "$NOTES_FILE" \
          "$JAR_PATH"
        
        echo "✅ GitHub Release created successfully!"
        echo "🔗 View release: https://github.com/${{ github.repository }}/releases/tag/$NEW_VERSION"
        echo "📦 JAR attached: $JAR_NAME"
        echo "::endgroup::"
