plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.10.0'
}

group = 'org.fitznet'
version = '0.30.0'

repositories {
    mavenCentral()
    maven { url 'https://m2.coly.dev/releases' }
}

dependencies {
    implementation("net.dv8tion:JDA:5.6.1") {
        exclude module: 'opus-java' // not needed for text-only bot
        exclude module: 'tink' // not needed for text-only bot
    }
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // gRPC equivalents of the REST endpoints (src/main/proto), served on spring.grpc.server.port
    implementation 'org.springframework.boot:spring-boot-starter-grpc-server'
    implementation 'io.grpc:grpc-protobuf'
    implementation 'io.grpc:grpc-stub'

    compileOnly 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-grpc-server-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'junit:junit:4.13.2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${dependencyManagement.importedProperties['protobuf-java.version']}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${dependencyManagement.importedProperties['grpc-java.version']}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                maybeCreate('grpc').option('@generated=omit')
            }
        }
    }
}

test {
    useJUnitPlatform()

    // Random gRPC port so parallel test contexts never collide on 9090
    systemProperty 'spring.grpc.server.port', '0'

    // Enable parallel test execution
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
    
    // Configure thread pool size (adjust based on your CPU cores)
    systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'dynamic'
    systemProperty 'junit.jupiter.execution.parallel.config.dynamic.factor', '2'
    
    // Use multiple worker processes for better isolation
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    
    // Increase memory for parallel execution
    minHeapSize = "256m"
    maxHeapSize = "1g"
    
    // Show test results in real-time
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "short"
        showStandardStreams = false
    }
}

apply plugin: 'idea'

compileJava {
    options.annotationProcessorPath = configurations.annotationProcessor
}