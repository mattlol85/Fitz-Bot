plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.fitznet'
version = '0.28.3'

repositories {
    mavenCentral()
    maven { url 'https://m2.coly.dev/releases' }
}

dependencies {
    implementation("net.dv8tion:JDA:5.6.1") {
        exclude module: 'opus-java' // not needed for text-only bot
        exclude module: 'tink' // not needed for text-only bot
    }
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    compileOnly 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'junit:junit:4.13.2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

test {
    useJUnitPlatform()
    
    // Enable parallel test execution
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
    
    // Configure thread pool size (adjust based on your CPU cores)
    systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'dynamic'
    systemProperty 'junit.jupiter.execution.parallel.config.dynamic.factor', '2'
    
    // Use multiple worker processes for better isolation
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    
    // Increase memory for parallel execution
    minHeapSize = "256m"
    maxHeapSize = "1g"
    
    // Show test results in real-time
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "short"
        showStandardStreams = false
    }
}

apply plugin: 'idea'

compileJava {
    options.annotationProcessorPath = configurations.annotationProcessor
}