# JUnit 5 Parallel Execution Configuration

# Enable parallel execution
junit.jupiter.execution.parallel.enabled=true

# Run test classes and methods in parallel
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Use dynamic thread pool sizing
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=2.0

# Custom thread pool for CPU-intensive tests
junit.jupiter.execution.parallel.config.custom.class=java.util.concurrent.ForkJoinPool

# Timeout settings for faster failure detection
junit.jupiter.execution.timeout.default=30s
junit.jupiter.execution.timeout.testable.method.default=10s
