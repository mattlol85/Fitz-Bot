server.port=8080
spring.threads.virtual.enabled=true
discord.bot.token=${DISCORD_BOT_TOKEN:your-default-token-here}
# Management endpoints
management.endpoints.web.exposure.include=health,info,loggers,logfile,prometheus
management.endpoint.loggers.enabled=true
management.endpoint.logfile.enabled=true
management.endpoint.health.probes.enabled=true


# Logging configuration
logging.file.name=logs/fitz-bot.log
logging.level.org.fitznet=DEBUG
logging.level.root=INFO
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
