<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">FitzBot Logs</title>
    <style>
        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            background-color: #1e1e1e;
            color: #d4d4d4;
        }
        .header {
            background-color: #2d2d30;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 15px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        input, select, button {
            background-color: #3c3c3c;
            border: 1px solid #555;
            color: #d4d4d4;
            padding: 8px 12px;
            border-radius: 3px;
        }
        button {
            cursor: pointer;
            background-color: #0e639c;
        }
        button:hover {
            background-color: #1177bb;
        }
        .log-container {
            background-color: #252526;
            border: 1px solid #3e3e42;
            border-radius: 5px;
            height: 600px;
            overflow-y: auto;
            padding: 15px;
            font-size: 13px;
            line-height: 1.4;
        }
        .log-line {
            margin-bottom: 2px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-line.error {
            color: #f48771;
        }
        .log-line.warn {
            color: #dcdcaa;
        }
        .log-line.info {
            color: #9cdcfe;
        }
        .log-line.debug {
            color: #608b4e;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            background-color: #2d2d30;
            border-radius: 3px;
        }
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .loading {
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 th:text="${title}">FitzBot Logs</h1>

        <div class="controls">
            <div class="control-group">
                <label for="lines">Lines:</label>
                <select id="lines">
                    <option value="50">50</option>
                    <option value="100" selected>100</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                </select>
            </div>

            <div class="control-group">
                <label for="level">Level:</label>
                <select id="level">
                    <option value="">All</option>
                    <option value="ERROR">Error</option>
                    <option value="WARN">Warning</option>
                    <option value="INFO">Info</option>
                    <option value="DEBUG">Debug</option>
                </select>
            </div>

            <div class="control-group">
                <label for="search">Search:</label>
                <input type="text" id="search" placeholder="Enter search term...">
            </div>

            <button onclick="loadLogs()">Refresh</button>
            <button onclick="clearLogs()">Clear</button>

            <div class="auto-refresh">
                <input type="checkbox" id="autoRefresh">
                <label for="autoRefresh">Auto-refresh (5s)</label>
            </div>
        </div>
    </div>

    <div class="log-container" id="logContainer">
        <div class="log-line">Loading logs...</div>
    </div>

    <div class="status">
        <span id="status">Ready</span> |
        <span id="logCount">0 lines</span> |
        Last updated: <span id="lastUpdate">Never</span>
    </div>

    <script>
        let autoRefreshInterval;

        function loadLogs() {
            const lines = document.getElementById('lines').value;
            const level = document.getElementById('level').value;
            const search = document.getElementById('search').value.trim();
            const container = document.getElementById('logContainer');

            document.getElementById('status').textContent = 'Loading...';
            container.classList.add('loading');

            let url;
            if (search) {
                url = `/logs/api/search?query=${encodeURIComponent(search)}&maxResults=${lines}`;
            } else if (level) {
                url = `/logs/api/level/${level}?maxResults=${lines}`;
            } else {
                url = `/logs/api/tail?lines=${lines}`;
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    displayLogs(data.lines);
                    document.getElementById('logCount').textContent = `${data.lines.length} lines`;
                    document.getElementById('status').textContent = 'Ready';
                    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
                })
                .catch(error => {
                    console.error('Error loading logs:', error);
                    document.getElementById('status').textContent = 'Error loading logs';
                    container.innerHTML = '<div class="log-line error">Error loading logs: ' + error.message + '</div>';
                })
                .finally(() => {
                    container.classList.remove('loading');
                });
        }

        function displayLogs(lines) {
            const container = document.getElementById('logContainer');
            container.innerHTML = '';

            if (lines.length === 0) {
                container.innerHTML = '<div class="log-line">No logs found</div>';
                return;
            }

            lines.forEach(line => {
                const div = document.createElement('div');
                div.className = 'log-line';
                div.textContent = line;

                // Add color coding based on log level
                if (line.includes('ERROR')) {
                    div.classList.add('error');
                } else if (line.includes('WARN')) {
                    div.classList.add('warn');
                } else if (line.includes('INFO')) {
                    div.classList.add('info');
                } else if (line.includes('DEBUG')) {
                    div.classList.add('debug');
                }

                container.appendChild(div);
            });

            // Auto-scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('logContainer').innerHTML = '<div class="log-line">Logs cleared</div>';
            document.getElementById('logCount').textContent = '0 lines';
        }

        function setupAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');

            if (checkbox.checked) {
                autoRefreshInterval = setInterval(loadLogs, 5000);
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                }
            }
        }

        // Event listeners
        document.getElementById('autoRefresh').addEventListener('change', setupAutoRefresh);
        document.getElementById('search').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadLogs();
            }
        });

        // Load initial logs
        loadLogs();
    </script>
</body>
</html>
